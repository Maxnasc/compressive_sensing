[project]
name = "compressed_data_classification"
version = "0.0.1"
description = "Compressive sensing algorithm for fault identification on power trasnmission networks"
authors = [
    {name = "Maxnasc7"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
package-mode = false
dependencies = [
    "matplotlib (>=3.10.3,<4.0.0)",
    "numpy (>=1.24,<2.3)",
    "scipy (>=1.16.1,<2.0.0)",
    "cvxpy (>=1.7.1,<2.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "codecarbon (>=3.0.4,<4.0.0)",
    "pywavelets (>=1.9.0,<2.0.0)",
    "mplcursors (>=0.7,<0.8)",
    "kagglehub (>=0.3.13,<0.4.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "cuml-cu12 (>=25.12.0,<26.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
